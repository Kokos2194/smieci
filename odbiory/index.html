<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protokół usterek</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ECEEEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111518" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Usterki">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: phone-first single column for use on site; the building is drawn as a stacked section (roof, slabs, ground hatch), the main action sits in the thumb zone. */
:root{
  --bg:#ECEEEF; --surface:#FFFFFF; --surface-2:#F3F5F6; --ink:#1B2126; --ink-2:#5A6570; --line:#D2D8DD;
  --accent:#1E56C8; --accent-ink:#FFFFFF; --accent-soft:#E2EAF9;
  --open:#C4401A; --open-soft:#FBE5DC; --done:#2A7D48; --done-soft:#DDEFE2; --on-signal:#FFFFFF;
  --hatch:#8D98A2; --hatch-soft:rgba(27,33,38,.06); --scrim:rgba(12,16,20,.48);
  --shadow:0 1px 2px rgba(20,30,40,.06),0 10px 30px rgba(20,30,40,.12);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111518; --surface:#1A2025; --surface-2:#222A31; --ink:#E6EAED; --ink-2:#98A4AE; --line:#313B44;
  --accent:#7DA3FF; --accent-ink:#0A1226; --accent-soft:#1D2A46;
  --open:#FF8058; --open-soft:#3A221A; --done:#5DC685; --done-soft:#163021; --on-signal:#12100E;
  --hatch:#5F6B76; --hatch-soft:rgba(230,234,237,.06); --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111518; --surface:#1A2025; --surface-2:#222A31; --ink:#E6EAED; --ink-2:#98A4AE; --line:#313B44;
  --accent:#7DA3FF; --accent-ink:#0A1226; --accent-soft:#1D2A46;
  --open:#FF8058; --open-soft:#3A221A; --done:#5DC685; --done-soft:#163021; --on-signal:#12100E;
  --hatch:#5F6B76; --hatch-soft:rgba(230,234,237,.06); --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.locked{overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:6px}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:4px;min-height:52px}
.top-t{flex:1;min-width:0;padding-inline:4px}
.top-t h1{margin:0;font:600 21px/1.15 var(--f-display);letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-t p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.ib{width:44px;height:44px;flex:none;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:12px;color:var(--ink);padding:0}
.ib:hover{background:var(--surface-2)}
.top .back{margin-left:-10px}
.top .ib:last-child{margin-right:-8px}

.main{max-width:760px;margin:0 auto;padding-block:18px 132px;display:flex;flex-direction:column;gap:24px}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:38px}
.sh h2,.lbl,.fld>label{margin:0;font:600 13px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2)}
.hint{margin:0;font-size:14px;color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{min-height:40px;padding:0 13px;font-size:15px;border-radius:10px}
.btn.sm .ic{width:19px;height:19px}
.btn.danger{color:var(--open);border-color:var(--open)}
.btn.danger.armed{background:var(--open);color:var(--on-signal)}
.btn.grow{flex:1;min-width:0}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* notes */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:14.5px}
.note.warn{background:var(--open-soft)}
.note .ic{margin-top:1px}
.note p{margin:0}
.pill{display:inline-flex;align-items:center;gap:6px}
.pill i{width:8px;height:8px;border-radius:4px;background:var(--done);flex:none}
.pill.off i{background:var(--open)}

/* project cards */
.plist{display:flex;flex-direction:column;gap:12px}
.pcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.pcard:hover{border-color:var(--ink-2)}
.pcard h3{margin:0;font:600 21px/1.2 var(--f-display)}
.pcard .addr{margin-top:2px;color:var(--ink-2);font-size:14px}
.tag{display:inline-block;margin-bottom:6px;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:600 11.5px/1.5 var(--f-display);text-transform:uppercase;letter-spacing:.08em}
.pmeta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:12px;font-size:14.5px;color:var(--ink-2)}
.pmeta b{font:600 17px var(--f-display);color:var(--ink)}
.pmeta .c-open{color:var(--open)} .pmeta .c-done{color:var(--done)}
.prog{display:flex;height:8px;margin-top:10px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.prog i{display:block;height:100%}
.prog .p-done{background:var(--done)} .prog .p-open{background:var(--open)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;min-width:0}
.stat b{display:block;font:600 32px/1 var(--f-display)}
.stat span{display:block;margin-top:4px;font-size:13.5px;color:var(--ink-2)}
.stat.open b{color:var(--open)} .stat.done b{color:var(--done)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 13px;border-radius:21px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:500;text-align:left}
.chip .ic{width:19px;height:19px}
.chip .n{font:600 15px var(--f-display);color:var(--open)}
.chip .n.z{color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.chips.sm .chip{min-height:38px;font-size:14.5px;padding:6px 12px;line-height:1.2}

/* building section */
.bld{position:relative;margin-inline:8px;border-inline:2px solid var(--ink);background:var(--surface)}
.roof{height:9px;margin-inline:-9px;border-top:3px solid var(--ink);border-bottom:2px solid var(--ink);background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 9px)}
.fl{display:grid;grid-template-columns:62px minmax(0,1fr);border-bottom:2px solid var(--ink)}
.fl.under{background-image:repeating-linear-gradient(135deg,var(--hatch-soft) 0 5px,transparent 5px 10px)}
.fl-lab{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;padding:8px 6px 8px 8px;border:0;border-right:1px solid var(--line);background:var(--surface-2);text-align:left;min-width:0}
.fl-lab b{font:700 22px/1 var(--f-display)}
.fl-lab span{font-size:11.5px;line-height:1.2;color:var(--ink-2);overflow-wrap:anywhere}
.fl-lab:hover b{color:var(--accent)}
.fl-units{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));overflow:hidden;min-width:0}
.u{position:relative;min-height:72px;padding:8px 8px 15px;border:0;background-color:transparent;text-align:left;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line);display:flex;flex-direction:column;min-width:0}
.u:hover .u-n{color:var(--accent)}
.u-n{font:600 18px/1.1 var(--f-display);overflow-wrap:break-word;hyphens:auto;padding-right:20px}
.u.common{background-image:repeating-linear-gradient(135deg,var(--hatch-soft) 0 6px,transparent 6px 12px)}
.u.common .u-n{font-size:13px;font-weight:500;line-height:1.15;padding-right:22px}
.u.st-open{background-color:var(--open-soft)}
.u.st-done{background-color:var(--done-soft)}
.u-c{position:absolute;top:6px;right:5px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--open);color:var(--on-signal);font:600 13.5px/22px var(--f-display);text-align:center}
.u-ok{position:absolute;top:5px;right:4px;color:var(--done)}
.u-ok .ic{width:20px;height:20px;stroke-width:2.6}
.u-bar{position:absolute;left:8px;right:8px;bottom:6px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--done) var(--p),var(--open) var(--p))}
.u-add{align-items:center;justify-content:center;gap:4px;color:var(--ink-2);font-size:13px;grid-column:1/-1;flex-direction:row}
.ground{height:14px;margin-inline:-16px;background:repeating-linear-gradient(135deg,var(--hatch) 0 1.5px,transparent 1.5px 7px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);background:var(--surface)}
.legend .l-open{background:var(--open-soft);border-color:var(--open)}
.legend .l-done{background:var(--done-soft);border-color:var(--done)}
.legend .l-com{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 4px)}

/* segmented */
.seg{display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{flex:1;min-width:0;min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14.5px;color:var(--ink-2);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg button span{font-family:var(--f-display);opacity:.8}

/* defects */
.dl{display:flex;flex-direction:column;gap:10px}
.d{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px 8px}
.d.done{background:var(--surface-2)}
.d.done .d-t{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-2)}
.ck{width:46px;height:46px;display:grid;place-items:center;border:0;background:transparent;padding:0;border-radius:10px;align-self:start}
.ck i,.tgl i{width:30px;height:30px;border-radius:8px;border:2.5px solid var(--ink-2);display:grid;place-items:center;background:var(--surface);color:var(--on-signal)}
.ck i .ic,.tgl i .ic{width:20px;height:20px;stroke-width:3}
.ck[aria-checked="true"] i,.tgl[aria-checked="true"] i{background:var(--done);border-color:var(--done)}
.d-b{display:flex;flex-direction:column;gap:3px;min-width:0;padding:4px 0 0;border:0;background:transparent;text-align:left}
.d-cat{display:flex;align-items:center;gap:6px;font:600 12.5px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.d-cat .ic{width:17px;height:17px}
.d-t{font-weight:600;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.d-note{font-size:14.5px;overflow-wrap:anywhere}
.d-m{font-size:13px;color:var(--ink-2)}
.d-m.ok{color:var(--done)}
.thumbs{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.th{padding:0;border:0;background:none;border-radius:8px}
.th img,.thumbs img{display:block;width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
img.broken{visibility:hidden}
.d.compact .d-t{font-size:16px}

/* report */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.mx{border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px}
.mx th,.mx td{padding:10px 9px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.mx tr:last-child td{border-bottom:0}
.mx th:first-child,.mx td:first-child{position:sticky;left:0;text-align:left;background:var(--surface);border-right:1px solid var(--line)}
.mx thead th{font:600 12.5px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);vertical-align:bottom}
.mx td:first-child{display:flex;align-items:center;gap:7px;font-weight:500}
.mx td:first-child .ic{width:18px;height:18px}
.mx td.z{color:var(--hatch)}
.mx td.h{font:600 16px var(--f-display);color:var(--open)}
.mx.done td.h{color:var(--done)}
.mx td.t,.mx th.t{font-weight:700;background:var(--surface-2)}
.mx tbody tr{cursor:pointer}
.mx tbody tr.sel td{background:var(--accent-soft)}
.mx tfoot td{font-weight:700;background:var(--surface-2);border-top:1.5px solid var(--line);border-bottom:0}
.sel-wrap{position:relative}
.inp,select.inp{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
textarea.inp{min-height:76px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.rg-f{margin:14px 0 2px;padding-bottom:6px;border-bottom:2px solid var(--ink);font:700 15px/1.2 var(--f-display);text-transform:uppercase;letter-spacing:.09em;display:flex;justify-content:space-between;gap:8px}
.rg-f span{color:var(--ink-2);font-weight:600}
.rg-u{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:10px 0 6px;font:600 18px var(--f-display)}
.rg-u button{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.rg-u button:hover{color:var(--accent)}
.rg-u span{font:500 13.5px var(--f-body);color:var(--ink-2)}
.checkline{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.checkline input{width:22px;height:22px;accent-color:var(--accent)}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.nav-u{display:inline-flex;align-items:center;gap:2px;min-height:48px;min-width:64px;padding:0 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font:600 15px var(--f-display);justify-content:center}
.nav-u:disabled{opacity:.35}
.nav-u .ic{width:18px;height:18px}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 18px;text-align:center;border:1.5px dashed var(--line);border-radius:16px;color:var(--ink-2)}
.empty h3{margin:0;font:600 21px var(--f-display);color:var(--ink)}
.empty p{margin:0;max-width:36ch}
.empty svg.art{width:120px;height:auto;color:var(--ink-2)}

/* sheet */
#sheet-root{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s}
#sheet-root.in .sheet-back{opacity:1}
.sheet{position:relative;width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 10px);display:flex;flex-direction:column;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:var(--shadow);transform:translateY(28px);opacity:0;transition:transform .22s ease,opacity .2s ease}
#sheet-root.in .sheet{transform:none;opacity:1}
.sheet.full{height:calc(100% - env(safe-area-inset-top,0px) - 10px)}
.sh-h{display:flex;align-items:center;gap:6px;padding-block:8px;border-bottom:1px solid var(--line)}
.sh-h h2{flex:1;min-width:0;margin:0;font:600 21px/1.2 var(--f-display)}
.sh-h .ctx{font:600 15px var(--f-display);color:var(--ink-2);white-space:nowrap}
.sh-h .ib:first-child{margin-left:-10px}
.sh-b{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-block:16px 20px;display:flex;flex-direction:column;gap:20px}
.sh-f{display:flex;gap:10px;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.fld{display:flex;flex-direction:column;gap:8px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:520px){.cats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:72px;padding:8px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:600;min-width:0}
.cat .ic{width:27px;height:27px}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--ink)}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ph:empty{display:none}
.ph-i{position:relative;aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center}
.ph-i img{width:100%;height:100%;object-fit:cover;display:block}
.ph-x{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:17px;border:0;background:rgba(0,0,0,.62);color:#fff;display:grid;place-items:center;padding:0}
.ph-x .ic{width:18px;height:18px}
.tgl{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:16.5px;text-align:left}
.tgl[aria-checked="true"]{border-color:var(--done);background:var(--done-soft)}
.err{margin:0;padding:10px 12px;border-radius:10px;background:var(--open-soft);color:var(--ink);font-weight:500}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}

const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const ROOMS=['Salon','Pokój','Pokój 2','Pokój 3','Kuchnia','Łazienka','WC','Przedpokój','Garderoba','Balkon','Taras','Komórka','Klatka schodowa','Korytarz','Garaż','Elewacja'];
const STATUS={open:'do poprawy',done:'poprawione',all:'wszystkie'};

/* ---------- environment & prefs ---------- */
const Env={artifact:!!(window.claude&&typeof window.claude.use==='function'),downloads:null,assets:false};
const Prefs={get(k,d){try{const v=localStorage.getItem('pu.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('pu.'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- store ---------- */
const KINDS=['projects','floors','units','defects'];
const Store={mode:'loading',ready:false,note:'',readOnly:false,data:{projects:new Map(),floors:new Map(),units:new Map(),defects:new Map()},urls:new Map()};
let B=null;

function idbReq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const LocalBackend={
  name:'local',
  async init(){
    const open=indexedDB.open('protokol-usterek',1);
    open.onupgradeneeded=()=>{const d=open.result;[...KINDS,'photos','meta'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};
    this.db=await idbReq(open);
    for(const k of KINDS){const rows=await idbReq(this.db.transaction(k).objectStore(k).getAll());Store.data[k]=new Map(rows.map(r=>[r.id,r]))}
    const seeded=await idbReq(this.db.transaction('meta').objectStore('meta').get('seeded'));
    return {firstRun:!seeded};
  },
  tx(store,mode,fn){return idbReq(fn(this.db.transaction(store,mode).objectStore(store)))},
  markSeeded(){return this.tx('meta','readwrite',s=>s.put({id:'seeded',at:Date.now()}))},
  put(k,o){return this.tx(k,'readwrite',s=>s.put(o))},
  del(k,id){return this.tx(k,'readwrite',s=>s.delete(id))},
  async addPhoto(blob){const id=uid();await this.tx('photos','readwrite',s=>s.put({id,blob}));return 'l:'+id},
  async photoBlob(ref){const r=await this.tx('photos','readonly',s=>s.get(ref.slice(2)));return r?r.blob:null},
  delPhoto(ref){return this.tx('photos','readwrite',s=>s.delete(ref.slice(2)))},
};
const MemoryBackend={
  name:'memory',photos:new Map(),
  async init(){return {firstRun:true}},markSeeded(){},put(){},del(){},
  async addPhoto(blob){const id=uid();this.photos.set(id,blob);return 'l:'+id},
  async photoBlob(ref){return this.photos.get(ref.slice(2))||null},
  delPhoto(ref){this.photos.delete(ref.slice(2))},
};
const wq=new Map();
function enqueue(path,fn){const prev=wq.get(path)||Promise.resolve();const p=prev.catch(()=>{}).then(fn);wq.set(path,p);p.then(()=>{if(wq.get(path)===p)wq.delete(path)},()=>{if(wq.get(path)===p)wq.delete(path)});return p}
const CloudBackend={
  name:'cloud',
  init(db,assets){
    this.db=db;this.assets=assets;const got=new Set();
    const timer=setTimeout(()=>{if(!Store.ready){Store.note='Nie mogę połączyć się z bazą. Sprawdź internet – dane pojawią się, gdy połączenie wróci.';render()}},10000);
    KINDS.forEach(k=>{
      db.collection(k).onSnapshot(snap=>{
        Store.data[k]=new Map(snap.docs.map(d=>[d.id,Object.assign({},d.data(),{id:d.id})]));
        if(!got.has(k)){got.add(k);if(got.size===KINDS.length){Store.ready=true;Store.note='';clearTimeout(timer)}}
        bump();scheduleRender();
      },err=>{console.warn(k,err);Store.note='Połączenie z bazą zostało przerwane. Odśwież stronę.';Store.ready=true;clearTimeout(timer);scheduleRender()});
    });
  },
  put(k,o){const body=Object.assign({},o);delete body.id;return enqueue(k+'/'+o.id,()=>this.db.doc(k+'/'+o.id).set(body))},
  del(k,id){return enqueue(k+'/'+id,()=>this.db.doc(k+'/'+id).delete())},
  async addPhoto(blob){if(!this.assets)throw {code:'no_assets'};const r=await this.assets.upload(blob,{type:'image/jpeg'});return 'a:'+r.id},
  async photoBlob(ref){if(!ref.startsWith('a:'))return null;const r=await fetch('/_blob/'+ref.slice(2));return r.ok?r.blob():null},
  async delPhoto(ref){if(this.assets&&ref.startsWith('a:'))try{await this.assets.delete(ref.slice(2))}catch(e){}},
};

let IDX=null;
function bump(){IDX=null}
function idx(){
  if(IDX)return IDX;
  const D=Store.data,floorsBy=new Map(),unitsBy=new Map(),defBy=new Map(),defByP=new Map();
  const push=(m,k,v)=>{let a=m.get(k);if(!a){a=[];m.set(k,a)}a.push(v)};
  for(const f of D.floors.values())push(floorsBy,f.projectId,f);
  for(const u of D.units.values())if(D.floors.has(u.floorId))push(unitsBy,u.floorId,u);
  for(const d of D.defects.values())if(D.units.has(d.unitId)){push(defBy,d.unitId,d);push(defByP,d.projectId,d)}
  for(const a of floorsBy.values())a.sort((x,y)=>(x.level-y.level)||cmp(x.name,y.name));
  for(const a of unitsBy.values())a.sort((x,y)=>((x.order||0)-(y.order||0))||cmp(x.name,y.name));
  for(const a of defBy.values())a.sort((x,y)=>(x.done-y.done)||((y.createdAt||0)-(x.createdAt||0)));
  return IDX={floorsBy,unitsBy,defBy,defByP};
}
const floorsOf=pid=>idx().floorsBy.get(pid)||[];
const unitsOf=fid=>idx().unitsBy.get(fid)||[];
const defectsOfUnit=id=>idx().defBy.get(id)||[];
const defectsOfProject=pid=>idx().defByP.get(pid)||[];
const unitsOfProject=pid=>floorsOf(pid).flatMap(f=>unitsOf(f.id));
function counts(list){let o=0,d=0;for(const x of list)x.done?d++:o++;return {open:o,done:d,total:o+d}}

function writeErr(e){
  console.warn(e);const c=e&&e.code;
  if(c==='invalid_argument'){Store.readOnly=true;toast('Masz dostęp tylko do podglądu – zmiany nie są zapisywane.')}
  else if(c==='quota_exceeded')toast('Baza jest pełna. Usuń niepotrzebną budowę.');
  else toast('Nie udało się zapisać. Sprawdź połączenie.');
}
function persist(kind,obj){Store.data[kind].set(obj.id,obj);bump();scheduleRender();return Promise.resolve().then(()=>B.put(kind,obj)).catch(writeErr)}
async function pool(tasks,n=4){let i=0;const run=async()=>{while(i<tasks.length){const t=tasks[i++];try{await t()}catch(e){console.warn(e)}}};await Promise.all(Array.from({length:Math.min(n,tasks.length)},run))}
async function persistMany(items){
  for(const [k,o] of items)Store.data[k].set(o.id,o);bump();scheduleRender();
  let failed=null;await pool(items.map(([k,o])=>()=>Promise.resolve(B.put(k,o)).catch(e=>{failed=e})),4);if(failed)writeErr(failed);
}
async function removeMany(items,photos=[]){
  for(const [k,id] of items)Store.data[k].delete(id);bump();scheduleRender();
  let failed=null;await pool([...items.map(([k,id])=>()=>Promise.resolve(B.del(k,id)).catch(e=>{failed=e})),...photos.map(r=>()=>B.delPhoto(r))],4);if(failed)writeErr(failed);
}
function deleteDefects(ds){return removeMany(ds.map(d=>['defects',d.id]),ds.flatMap(d=>d.photos||[]))}
function deleteUnit(u){const ds=defectsOfUnit(u.id);return removeMany([...ds.map(d=>['defects',d.id]),['units',u.id]],ds.flatMap(d=>d.photos||[]))}
function deleteFloor(f){const us=unitsOf(f.id);const ds=us.flatMap(u=>defectsOfUnit(u.id));return removeMany([...ds.map(d=>['defects',d.id]),...us.map(u=>['units',u.id]),['floors',f.id]],ds.flatMap(d=>d.photos||[]))}
function deleteProject(p){
  const D=Store.data;const ds=[...D.defects.values()].filter(d=>d.projectId===p.id);const us=[...D.units.values()].filter(u=>u.projectId===p.id);const fs=[...D.floors.values()].filter(f=>f.projectId===p.id);
  return removeMany([...ds.map(d=>['defects',d.id]),...us.map(u=>['units',u.id]),...fs.map(f=>['floors',f.id]),['projects',p.id]],ds.flatMap(d=>d.photos||[]));
}

/* ---------- photos ---------- */
function imgSrc(ref){return ref.startsWith('a:')?'/_blob/'+ref.slice(2):(Store.urls.get(ref)||'')}
function imgTag(ref){const s=imgSrc(ref);return `<img alt="" decoding="async" ${s?`src="${esc(s)}"`:`data-ref="${esc(ref)}"`}>`}
function hydrate(root){
  $$('img[data-ref]',root).forEach(async img=>{
    const ref=img.dataset.ref;img.removeAttribute('data-ref');
    try{let u=Store.urls.get(ref);if(!u){const b=await B.photoBlob(ref);if(!b)throw 0;u=URL.createObjectURL(b);Store.urls.set(ref,u)}img.src=u}catch(e){img.classList.add('broken')}
  });
}
document.addEventListener('error',e=>{if(e.target&&e.target.tagName==='IMG')e.target.classList.add('broken')},true);
function loadBitmap(blob){
  if(window.createImageBitmap)return createImageBitmap(blob).catch(()=>loadImg(blob));
  return loadImg(blob);
}
function loadImg(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const i=new Image();i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(u),1000)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};i.src=u})}
async function compressPhoto(file){
  const img=await loadBitmap(file);const w=img.width,h=img.height,s=Math.min(1,1600/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);
  const stamp=new Date().toLocaleString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const fs=Math.max(14,Math.round(c.width*0.028));g.font=`600 ${fs}px sans-serif`;g.textAlign='right';g.textBaseline='bottom';
  g.lineWidth=Math.max(3,fs/5);g.strokeStyle='rgba(0,0,0,.65)';g.fillStyle='#fff';const x=c.width-fs*.6,y=c.height-fs*.5;g.strokeText(stamp,x,y);g.fillText(stamp,x,y);

const stack=[];let ignorePop=false;
function go(view,params={}){

/* ---------- sheets ---------- */
let sheetClose=null;
function openSheet(html,{full=false,onMount,onClose,backdrop=true}={}){
  closeSheet();
  const root=$('#sheet-root');
  root.innerHTML=`<div class="sheet-back" ${backdrop?'data-close':''}></div><div class="sheet ${full?'full':''}" role="dialog" aria-modal="true">${html}</div>`;
  root.hidden=false;document.body.classList.add('locked');
  const el=$('.sheet',root);sheetClose=onClose||null;
  root.onclick=e=>{if(e.target.closest('[data-close]'))closeSheet()};
  onMount&&onMount(el);hydrate(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.add('in')));
  return el;
}
function closeSheet(){
  const root=$('#sheet-root');if(root.hidden)return;
  const fn=sheetClose;sheetClose=null;fn&&fn();
  root.classList.remove('in');root.innerHTML='';root.hidden=true;root.onclick=null;document.body.classList.remove('locked');
}
const sheetHead=(title,ctx='')=>`<div class="sh-h gut"><button class="ib" data-close aria-label="Zamknij">${ic(UI.x)}</button><h2>${esc(title)}</h2>${ctx?`<span class="ctx">${esc(ctx)}</span>`:''}</div>`;
function armDelete(btn,label,fn){
  btn.addEventListener('click',()=>{if(btn.classList.contains('armed')){fn();return}btn.classList.add('armed');btn.innerHTML=ic(UI.trash)+esc(label);setTimeout(()=>{if(btn.isConnected&&btn.classList.contains('armed')){btn.classList.remove('armed');btn.innerHTML=btn.dataset.orig}},5000)});
  btn.dataset.orig=btn.innerHTML;
}

function openDefectForm(unitId,defectId){
  const u=Store.data.units.get(unitId);if(!u)return;
  const orig=defectId?Store.data.defects.get(defectId):null;
  const st={cat:orig?orig.cat:Prefs.get('lastCat',''),photos:orig?[...(orig.photos||[])]:[],done:!!(orig&&orig.done),added:[],removed:[],busy:0,saved:false};
  if(st.cat&&!CAT[st.cat])st.cat='';
  const canPhoto=!(Store.mode==='cloud'&&!CloudBackend.assets);
  const html=`${sheetHead(orig?'Edycja usterki':'Nowa usterka',u.name)}
  <div class="sh-b gut">
    <div class="fld"><span class="lbl">Rodzaj</span><div class="cats" id="f-cats"></div></div>
    <div class="fld"><label for="f-title">Usterka</label><input class="inp" id="f-title" autocomplete="off" enterkeyhint="done" placeholder="Wybierz z listy poniżej albo wpisz"><div class="chips sm" id="f-typ"></div></div>
    <div class="fld"><label for="f-room">Pomieszczenie</label><input class="inp" id="f-room" autocomplete="off" enterkeyhint="done" placeholder="np. Kuchnia"><div class="chips sm" id="f-rooms"></div></div>
    <div class="fld"><label for="f-note">Uwagi</label><textarea class="inp" id="f-note" rows="2" placeholder="Dokładne miejsce, wymiar, kto ma poprawić…"></textarea></div>
    <div class="fld"><span class="lbl">Zdjęcia</span><div class="ph" id="f-ph"></div>
      ${canPhoto?`<div class="row"><button type="button" class="btn sm" id="f-cam-b">${ic(UI.camera)}Zrób zdjęcie</button><button type="button" class="btn sm" id="f-gal-b">${ic(UI.image)}Z galerii</button>
      <input type="file" accept="image/*" capture="environment" class="vh" id="f-cam" tabindex="-1"><input type="file" accept="image/*" multiple class="vh" id="f-gal" tabindex="-1"></div>`:`<p class="hint">Dodawanie zdjęć jest tu dostępne tylko dla właściciela i edytorów.</p>`}
    </div>
    <button type="button" class="tgl" id="f-done" role="checkbox" aria-checked="false"><i></i><span>Poprawione</span></button>
    <p class="err" id="f-err" hidden></p>
    ${orig?`<button type="button" class="btn danger" id="f-del">${ic(UI.trash)}Usuń usterkę</button>`:''}
  </div>
  <div class="sh-f gut">${orig?'':`<button class="btn" id="f-next">Zapisz + następna</button>`}<button class="btn pri grow" id="f-save">${ic(UI.check)}Zapisz</button></div>`;
  openSheet(html,{full:true,backdrop:false,onClose:()=>{if(!st.saved)st.added.forEach(r=>B.delPhoto(r))},onMount:el=>{
    const q=s=>el.querySelector(s),tI=q('#f-title'),rI=q('#f-room'),nI=q('#f-note');
    tI.value=orig?orig.title:'';rI.value=orig?orig.room||'':'';nI.value=orig?orig.note||'':'';
    const paintCats=()=>{q('#f-cats').innerHTML=CATS.map(k=>`<button type="button" class="cat" data-cat="${k.id}" aria-pressed="${st.cat===k.id}">${ic(k.ic)}<span>${k.name}</span></button>`).join('')};
    const paintTyp=()=>{const k=CAT[st.cat],v=tI.value.trim();q('#f-typ').innerHTML=k?k.items.map(t=>`<button type="button" class="chip" data-t="${esc(t)}" aria-pressed="${v===t}">${esc(t)}</button>`).join(''):'<p class="hint">Najpierw wybierz rodzaj – pojawią się typowe usterki.</p>'};
    const paintRooms=()=>{const v=rI.value.trim();const list=u.kind==='common'?['Klatka schodowa','Korytarz','Garaż','Komórka','Elewacja','Dach','Wejście']:ROOMS;q('#f-rooms').innerHTML=list.map(r=>`<button type="button" class="chip" data-r="${esc(r)}" aria-pressed="${v===r}">${esc(r)}</button>`).join('')};
    const paintPh=()=>{const box=q('#f-ph');box.innerHTML=st.photos.map((r,i)=>`<div class="ph-i">${imgTag(r)}<button type="button" class="ph-x" data-rm="${i}" aria-label="Usuń zdjęcie">${ic(UI.x)}</button></div>`).join('')+(st.busy?'<div class="ph-i"><span class="spin"></span></div>'.repeat(st.busy):'');hydrate(box)};
    const paintDone=()=>{const b=q('#f-done');b.setAttribute('aria-checked',String(st.done));b.querySelector('i').innerHTML=st.done?ic(UI.check):''};
    const err=m=>{const e=q('#f-err');e.textContent=m;e.hidden=!m;if(m)e.scrollIntoView({block:'nearest',behavior:'smooth'})};
    paintCats();paintTyp();paintRooms();paintPh();paintDone();
    tI.addEventListener('input',()=>{paintTyp();err('')});rI.addEventListener('input',paintRooms);
    el.addEventListener('click',e=>{
      const c=e.target.closest('[data-cat]');if(c){const pk=CAT[st.cat];if(pk&&pk.items.includes(tI.value.trim()))tI.value='';st.cat=c.dataset.cat;paintCats();paintTyp();err('');return}
      const t=e.target.closest('[data-t]');if(t){tI.value=t.dataset.t;paintTyp();err('');return}
      const r=e.target.closest('[data-r]');if(r){rI.value=rI.value.trim()===r.dataset.r?'':r.dataset.r;paintRooms();return}
      const rm=e.target.closest('[data-rm]');if(rm){const i=+rm.dataset.rm,ref=st.photos[i];st.photos.splice(i,1);const ai=st.added.indexOf(ref);if(ai>=0){st.added.splice(ai,1);B.delPhoto(ref)}else st.removed.push(ref);paintPh();return}
      const img=e.target.closest('.ph-i img');if(img){const i=[...q('#f-ph').querySelectorAll('img')].indexOf(img);openLightbox(st.photos,i);return}
    });

      q('#f-cam').addEventListener('change',e=>onFiles(e.target));q('#f-gal').addEventListener('change',e=>onFiles(e.target));
    }
    const collect=()=>{

      if(!title){err('Wybierz usterkę z listy albo wpisz własny opis.');return null}
      if(st.busy){err('Poczekaj chwilę, zdjęcia jeszcze się zapisują.');return null}
      const now=Date.now();
      return {id:orig?orig.id:uid(),projectId:u.projectId,floorId:u.floorId,unitId:u.id,cat:st.cat,title,room:rI.value.trim(),note:nI.value.trim(),photos:[...st.photos],done:st.done,createdAt:orig?orig.createdAt:now,doneAt:st.done?(orig&&orig.done&&orig.doneAt?orig.doneAt:now):null,updatedAt:now};
    };
    q('#f-save').addEventListener('click',()=>{const d=collect();if(!d)return;Prefs.set('lastCat',d.cat);persist('defects',d);st.removed.forEach(r=>B.delPhoto(r));st.saved=true;closeSheet();toast(orig?'Zapisano zmiany':'Dodano usterkę')});
    const nx=q('#f-next');if(nx)nx.addEventListener('click',()=>{const d=collect();if(!d)return;Prefs.set('lastCat',d.cat);persist('defects',d);st.added=[];st.photos=[];st.done=false;tI.value='';nI.value='';paintTyp();paintPh();paintDone();q('.sh-b').scrollTo({top:0,behavior:'smooth'});toast('Dodano. Wpisz następną usterkę.')});
    const del=q('#f-del');if(del)armDelete(del,'Dotknij ponownie, aby usunąć',()=>{st.saved=true;st.added.forEach(r=>B.delPhoto(r));deleteDefects([Object.assign({},orig,{photos:[...new Set([...(orig.photos||[]),...st.photos])]})]);closeSheet();toast('Usunięto usterkę')});
  }});
}

function genFields(){return `
  <div class="grid2"><div class="fld"><label for="g-below">Kondygnacje podziemne</label><input class="inp" id="g-below" type="number" inputmode="numeric" min="0" max="5" value="0"></div>
  <div class="fld"><label for="g-above">Nadziemne (z parterem)</label><input class="inp" id="g-above" type="number" inputmode="numeric" min="1" max="40" value="4"></div></div>
  <div class="grid2"><div class="fld"><label for="g-per">Mieszkań na kondygnacji</label><input class="inp" id="g-per" type="number" inputmode="numeric" min="0" max="40" value="4"></div>
  <div class="fld"><label for="g-prefix">Oznaczenie</label><input class="inp" id="g-prefix" value="M" maxlength="6"></div></div>
  <div class="fld"><label for="g-num">Numeracja</label><select class="inp" id="g-num"><option value="cont">Ciągła: M1, M2, M3…</option><option value="floor">Z piętrem: M1.1, M1.2, M2.1…</option></select></div>
  <label class="checkline"><input type="checkbox" id="g-common" checked>Klatka schodowa na każdej kondygnacji</label>
  <p class="preview" id="g-prev"></p>`}
function genRead(el){const n=(s,min,max,d)=>{const v=parseInt(el.querySelector(s).value,10);return isNaN(v)?d:Math.max(min,Math.min(max,v))};return {below:n('#g-below',0,5,0),above:n('#g-above',1,40,4),per:n('#g-per',0,40,4),prefix:el.querySelector('#g-prefix').value.trim(),num:el.querySelector('#g-num').value,common:el.querySelector('#g-common').checked}}
function genBuild(pid,o){
  const items=[],now=Date.now();let n=1,first='',last='',flats=0;
  for(let l=-o.below;l<o.above;l++){
    const fid=uid();items.push(['floors',{id:fid,projectId:pid,name:floorAutoName(l),level:l,createdAt:now}]);
    let ord=0;const addU=(name,kind)=>items.push(['units',{id:uid(),projectId:pid,floorId:fid,name,kind,order:ord++,createdAt:now}]);
    if(l<0)addU('Garaż','common');
    else for(let i=1;i<=o.per;i++){const nm=o.num==='floor'?`${o.prefix}${l}.${i}`:`${o.prefix}${n++}`;if(!first)first=nm;last=nm;flats++;addU(nm,'flat')}
    if(o.common)addU('Klatka schodowa','common');
  }
  return {items,first,last,flats,floors:o.below+o.above};
}
function genPreview(el){const o=genRead(el);const g=genBuild('x',o);el.querySelector('#g-prev').textContent=`Powstanie ${g.floors} ${plural(g.floors,'kondygnacja','kondygnacje','kondygnacji')} i ${g.flats} ${plural(g.flats,'mieszkanie','mieszkania','mieszkań')}${g.flats?`: ${g.first} – ${g.last}`:''}.`}

function nextUnitName(pid){
  let pre='M',max=0;for(const u of unitsOfProject(pid)){if(u.kind==='common')continue;const m=/^(\D*)(\d+)$/.exec(u.name.trim());if(m&&+m[2]>=max){max=+m[2];pre=m[1]}}
  return pre+(max+1);
}

let lbState=null;
function openLightbox(refs,i){
  closeLightbox();if(!refs||!refs.length)return;lbState={refs,i:Math.max(0,i)};
  const el=document.createElement('div');el.className='lb';el.setAttribute('role','dialog');el.setAttribute('aria-label','Zdjęcie');
  document.body.appendChild(el);paintLb();
  el.addEventListener('click',e=>{if(e.target.closest('.lb-x')||e.target===el){closeLightbox();return}if(e.target.closest('.lb-p')){lbState.i=(lbState.i-1+refs.length)%refs.length;paintLb()}else if(e.target.closest('.lb-n')){lbState.i=(lbState.i+1)%refs.length;paintLb()}});
}

async function offerFile(name,blob){
  if(Env.downloads){
    try{await Env.downloads.save({filename:name,data:blob});toast('Plik gotowy: '+name)}
    catch(e){const c=e&&e.code;if(c==='declined')return;if(c==='host_unavailable')toast('Ta aplikacja nie zapisuje plików. Otwórz stronę w przeglądarce.');else toast('Nie udało się zapisać pliku.')}
    return;
  }
  if(Env.artifact){toast('Zapisywanie plików jest tu niedostępne.');return}
  const url=URL.createObjectURL(blob);const file=new File([blob],name,{type:blob.type});
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  const kb=blob.size>1048576?(blob.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(blob.size/1024))+' kB';
  openSheet(`${sheetHead('Plik gotowy')}<div class="sh-b gut"><p style="margin:0;overflow-wrap:anywhere"><b>${esc(name)}</b><br><span class="hint">${kb}</span></p>
    <div class="row">${canShare?`<button class="btn pri" id="o-share">${ic(UI.share)}Udostępnij</button>`:''}<a class="btn ${canShare?'':'pri'}" href="${url}" download="${esc(name)}" id="o-dl">${ic(UI.down)}Pobierz</a>${/\.pdf$/.test(name)?`<a class="btn" href="${url}" target="_blank" rel="noopener">Otwórz</a>`:''}</div>
    <p class="hint">„Udostępnij” wyśle plik np. przez WhatsApp, SMS albo e-mail do wykonawcy.</p></div>`,{onClose:()=>setTimeout(()=>URL.revokeObjectURL(url),60000),onMount:el=>{
    const s=el.querySelector('#o-share');if(s)s.addEventListener('click',async()=>{try{await navigator.share({files:[file],title:name})}catch(e){}});
  }});
}
function reportText(p,rows){
  const fd=filterDesc();const L=[`PROTOKÓŁ USTEREK – ${p.name}`,`${fd.cat} · ${fd.status} · ${fd.floor}`,`Stan na ${fmtDate(Date.now())}: ${rows.length} ${plural(rows.length,'pozycja','pozycje','pozycji')}`];
  let cf=null,cu=null,lp=0;
  for(const d of rows){
    if(d.floorId!==cf){cf=d.floorId;cu=null;L.push('',((Store.data.floors.get(cf)||{}).name||'').toUpperCase())}
    if(d.unitId!==cu){cu=d.unitId;L.push(((Store.data.units.get(cu)||{}).name||'')+':')}
    L.push(`${d.done?'☑':'☐'} ${++lp}. ${d.room?d.room+' – ':''}${d.title}${d.note?' ('+d.note+')':''}${S.report.cat==='all'?' ['+(CAT[d.cat]||CAT.inne).name+']':''}`);
  }

}
function reportCsv(rows){
  const q=v=>{const s=String(v??'');return /[";\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const H=['Lp.','Kondygnacja','Lokal','Pomieszczenie','Rodzaj','Usterka','Uwagi','Status','Data wpisu','Data poprawy','Zdjęcia'];
  const R=rows.map((d,i)=>[i+1,(Store.data.floors.get(d.floorId)||{}).name||'',(Store.data.units.get(d.unitId)||{}).name||'',d.room||'',(CAT[d.cat]||CAT.inne).name,d.title,d.note||'',d.done?'poprawione':'do poprawy',fmtDate(d.createdAt),d.done?fmtDate(d.doneAt):'',(d.photos||[]).length]);
  return '﻿'+[H,...R].map(r=>r.map(q).join(';')).join('\r\n');
}

    try{[db,assets,dl]=await Promise.all([window.claude.use('db'),window.claude.use('assets').catch(()=>null),window.claude.use('downloads').catch(()=>null)])}catch(e){}
    Env.downloads=dl;
    if(db){B=CloudBackend;Store.mode='cloud';CloudBackend.init(db,assets);render();return}
  }
  try{
    if(!window.indexedDB)throw new Error('no idb');
    B=LocalBackend;const r=await LocalBackend.init();Store.mode='local';
    if(r.firstRun&&Store.data.projects.size===0){await loadDemo();await LocalBackend.markSeeded()}
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(e){
    console.warn('local storage unavailable',e);B=MemoryBackend;Store.mode='memory';for(const k of KINDS)Store.data[k]=new Map();await loadDemo();
  }
  Store.ready=true;bump();render();
  if(!Env.artifact&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
})();
</script>
</body>
</html>
